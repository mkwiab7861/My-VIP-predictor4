<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WinGo Trend Rider & Smart Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-deep: #030712;
            --card-glass: rgba(13, 18, 36, 0.98);
            --white-stroke: rgba(255, 255, 255, 0.15);
            --accent-cyan: #00f2fe;
            --accent-green: #10b981;
            --accent-red: #ff3366;
            --gold: #ffb703;
            --skip-orange: #f97316;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 4px; }

        .app-card {
            width: 100%; max-width: 440px; background: var(--card-glass);
            border-radius: 16px; padding: 8px;
            border: 1px solid var(--white-stroke); box-shadow: 0 0 15px rgba(0,242,254,0.1);
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .header-title h1 { font-size: 8.5px; color: #fff; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .telegram-btn { background: #0088cc; color: #fff; font-size: 8px; font-weight: 800; padding: 3px 8px; border-radius: 12px; text-decoration: none; }

        /* 🌟 Compact Sticky Predictor Bar */
        .sticky-predictor-bar {
            position: sticky; top: 0; z-index: 999;
            background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(10px);
            border-radius: 10px; padding: 6px 8px; margin-bottom: 6px;
            border: 1px solid var(--accent-cyan); box-shadow: 0 2px 10px rgba(0, 242, 254, 0.15);
        }

        .top-info-row { display: flex; justify-content: space-between; align-items: center; font-size: 8.5px; margin-bottom: 3px; }
        .timer-clock { font-size: 12px; font-weight: 900; color: var(--accent-green); font-family: monospace; }

        .rider-signal-box {
            width: 100%; background: linear-gradient(135deg, rgba(0, 242, 254, 0.12), rgba(157, 78, 221, 0.15));
            border-radius: 8px; padding: 6px; text-align: center;
            border: 1px solid var(--accent-cyan);
        }
        .rider-signal-box.skip-mode {
            border-color: var(--skip-orange);
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.12), rgba(15, 23, 42, 0.95));
        }

        .signal-trend { 
            font-size: 22px; font-weight: 900; color: #fff; 
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); letter-spacing: 1.5px; line-height: 1;
        }
        .signal-trend.skip-mode { color: var(--skip-orange); text-shadow: 0 0 10px rgba(249, 115, 22, 0.6); }

        .metrics-bar {
            display: flex; justify-content: space-around; margin-top: 3px; padding-top: 3px;
            border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 8px; font-weight: 800; color: var(--text-sub);
        }
        .metrics-bar span { color: var(--gold); }

        /* 🌟 Enhanced Middle Mobile Browser Frame (Height Increased) */
        .browser-container {
            width: 100%; border-radius: 12px; overflow: hidden;
            border: 1px solid var(--gold); background: #000;
            box-shadow: 0 0 12px rgba(255, 183, 3, 0.2); margin-bottom: 6px;
        }

        .browser-header {
            background: #1e293b; padding: 5px 8px; display: flex; align-items: center; gap: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .browser-dots { display: flex; gap: 3px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .browser-address-bar {
            flex-grow: 1; background: rgba(15, 23, 42, 0.8); border-radius: 6px;
            padding: 3px 6px; font-size: 8.5px; color: var(--gold); font-weight: 600;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255, 183, 3, 0.2);
        }

        .open-external-btn {
            background: var(--gold); color: #000; font-size: 7.5px; font-weight: 900;
            padding: 2px 5px; border-radius: 4px; text-decoration: none;
        }

        /* 🚀 Frame height increased for better mobile experience */
        .browser-view {
            width: 100%; height: 550px; border: none; background: #fff; display: block;
        }

        .logic-panel { background: rgba(3, 7, 18, 0.6); border-radius: 8px; padding: 6px; margin-bottom: 6px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .logic-box { font-size: 8px; color: #cbd5e1; line-height: 1.2; background: rgba(15, 23, 42, 0.4); padding: 4px; border-radius: 4px; text-align: left; }

        .history-container { 
            background: rgba(3, 7, 18, 0.8); border-radius: 10px; padding: 6px; 
            border: 1px solid rgba(255, 183, 3, 0.25); 
        }
        .history-table { width: 100%; border-collapse: collapse; font-size: 8px; text-align: center; }
        .history-table th { color: var(--text-sub); padding: 3px 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .history-table td { padding: 3px 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }

        .badge-win { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); padding: 1px 3px; border-radius: 3px; font-weight: 800; }
        .badge-loss { background: rgba(255, 51, 102, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); padding: 1px 3px; border-radius: 3px; font-weight: 800; }
        .badge-skip { background: rgba(249, 115, 22, 0.15); color: var(--skip-orange); border: 1px solid var(--skip-orange); padding: 1px 3px; border-radius: 3px; font-weight: 800; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLBtPq8xK9COk6GZyC-zHEtLFfW8-qQH0",
            authDomain: "ghugh-b4903.firebaseapp.com",
            projectId: "ghugh-b4903",
            storageBucket: "ghugh-b4903.firebasestorage.app",
            messagingSenderId: "960134803091",
            appId: "1:960134803091:web:795feeb01f4199bbeee766",
            measurementId: "G-N87ZW6067E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let userId = localStorage.getItem("wingo_user_id");
        if (!userId) {
            userId = "User_" + Math.random().toString(36).substring(2, 9);
            localStorage.setItem("wingo_user_id", userId);
        }

        window.syncUserActivityToCloud = async function(historyLogs, totalWins, totalLosses, totalSkipped) {
            try {
                const expireAt = new Date();
                expireAt.setDate(expireAt.getDate() + 15);

                await setDoc(doc(db, "users_activity", userId), {
                    userId: userId,
                    lastUpdated: new Date().toISOString(),
                    expireAt: expireAt.toISOString(),
                    wins: totalWins,
                    losses: totalLosses,
                    skipped: totalSkipped,
                    history: historyLogs.slice(0, 20)
                }, { merge: true });
            } catch (e) {
                console.error("Cloud Sync Error: ", e);
            }
        };
    </script>
</head>
<body>

<div class="app-card">
    <div class="top-bar">
        <div class="header-title"><h1>WINGO RIDER & SMART DASHBOARD</h1></div>
        <a href="https://t.me/AsifWingoExperttrick" target="_blank" class="telegram-btn">TELEGRAM</a>
    </div>

    <!-- 🌟 Compact Sticky Predictor Bar -->
    <div class="sticky-predictor-bar">
        <div class="top-info-row">
            <div>PRD: <span id="targetPeriod" style="color:var(--gold); font-weight:900;">----</span></div>
            <div>LAST: <span id="lastNum" style="color:var(--accent-cyan); font-weight:900;">-</span></div>
            <div class="timer-clock" id="timerClock">00:30</div>
        </div>

        <div class="rider-signal-box" id="signalBox">
            <div class="signal-trend" id="predTrend">ANALYZING...</div>
            <div style="font-size:7.5px; font-weight:800; color:var(--accent-cyan);" id="phaseMode">⚡ Riding Live Trends...</div>

            <div class="metrics-bar">
                <div>MODE: <span id="riderMode">TREND RIDING</span></div>
                <div>STATUS: <span id="riderStatus">ACTIVE</span></div>
            </div>
        </div>
    </div>

    <!-- 🌟 Expanded Middle Browser Frame -->
    <div class="browser-container">
        <div class="browser-header">
            <div class="browser-dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="browser-address-bar">
                <span>🔒 98cashwin.com/#/register</span>
                <a href="https://98cashwin.com/#/register?invitationCode=5742952270031" target="_blank" class="open-external-btn">OPEN ↗</a>
            </div>
        </div>
        <iframe class="browser-view" src="https://98cashwin.com/#/register?invitationCode=5742952270031" title="98Cash Register View"></iframe>
    </div>

    <!-- 🧠 Logic Panel -->
    <div class="logic-panel">
        <div style="font-size: 8px; color: var(--accent-cyan); font-weight: 800; margin-bottom: 2px;">🧠 LOGIC & REASONING</div>
        <div class="logic-box" id="logicBox">> Following active trend momentum...</div>
    </div>

    <!-- 📊 History Logs -->
    <div class="history-container">
        <div style="font-size:8px; color:var(--text-sub); margin-bottom:4px; display:flex; justify-content:space-between;">
            <span style="color:var(--gold); font-weight:800;">📊 RIDER LOGS</span>
            <span id="winRateText" style="color:var(--gold)">WIN: 0/0 (SKIPPED: 0)</span>
        </div>
        <table class="history-table">
            <thead>
                <tr>
                    <th>PERIOD</th>
                    <th>RES</th>
                    <th>PRED</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr><td colspan="4" style="color:var(--text-sub);">Connecting...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const WINGO_30S_API = "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";
    let totalWins = 0, totalLosses = 0, totalSkipped = 0;
    let lastPrediction = null, lastProcessedIssue = "", historyLogs = [];
    let pauseCounter = 0; 

    function startTimerEngine() {
        setInterval(() => {
            const remSec = 30 - (new Date().getSeconds() % 30);
            document.getElementById('timerClock').innerText = `00:${remSec < 10 ? '0' : ''}${remSec}`;
            if (remSec === 29 || remSec === 1) runLiveEngine();
        }, 1000);
    }

    async function fetchDirectData() {
        try {
            const res = await fetch(WINGO_30S_API);
            if (res.ok) {
                const json = await res.json();
                return json.data?.list || json.list || json.data || [];
            }
        } catch (e) {}
        return null;
    }

    function computeTrendRiderSignal(list) {
        if (!list || list.length < 10) {
            return { decision: "BIG", mode: "INIT", status: "READY", phase: "Initializing Rider", reason: "Collecting live trend samples..." };
        }

        const sizes = list.map(i => {
            let num = parseInt(i.number ?? i.num ?? i.winningNumber ?? 0);
            return num >= 5 ? "BIG" : "SMALL";
        });

        if (pauseCounter > 0) {
            pauseCounter--;
            return {
                decision: "SKIP ⏸️",
                mode: "SMART PAUSE",
                status: `SAFE (${pauseCounter})`,
                phase: "🛑 Dirty Trend Avoidance",
                reason: `Choppy market detected. Engine paused safely.`
            };
        }

        let s0 = sizes[0]; 
        let s1 = sizes[1];
        let s2 = sizes[2];
        let s3 = sizes[3];

        let isChoppy = (s0 !== s1 && s1 !== s2 && s2 !== s3);
        if (isChoppy) {
            pauseCounter = 2; 
            return {
                decision: "SKIP ⏸️",
                mode: "DIRTY FILTER",
                status: "PAUSED",
                phase: "⚠️ Dirty Trend Detected",
                reason: `Messy alternation found. Rider paused temporarily.`
            };
        }

        let trendTarget = s0;
        let streak = 1;
        for (let i = 0; i < sizes.length - 1; i++) {
            if (sizes[i] === s0) streak++;
            else break;
        }

        return {
            decision: trendTarget,
            mode: "TREND RIDING",
            status: `${streak}x STREAK`,
            phase: `🟢 Riding Trend (${s0})`,
            reason: `Stable momentum active (${streak}x ${s0}).`
        };
    }

    async function runLiveEngine() {
        const list = await fetchDirectData();
        if (!list || list.length === 0) return;

        const latest = list[0];
        const lastNum = parseInt(latest.number ?? latest.num ?? latest.winningNumber ?? 0);
        const lastIssue = String(latest.issueNumber ?? latest.issue ?? latest.period ?? "");
        const actualSize = lastNum >= 5 ? "BIG" : "SMALL";

        if (lastIssue && lastIssue === lastProcessedIssue) return;
        if (lastIssue) lastProcessedIssue = lastIssue;

        document.getElementById('lastNum').innerText = `${lastNum} (${actualSize})`;

        try {
            if (lastIssue) {
                document.getElementById('targetPeriod').innerText = (BigInt(lastIssue) + 1n).toString().slice(-4);
            }
        } catch(e) { document.getElementById('targetPeriod').innerText = "NEXT"; }

        if (lastPrediction !== null) {
            let status = "";
            if (lastPrediction.includes("SKIP")) {
                status = "SKIPPED";
                totalSkipped++;
            } else {
                let isWin = (actualSize === lastPrediction);
                if (isWin) {
                    status = "WIN";
                    totalWins++;
                } else {
                    status = "LOSS";
                    totalLosses++;
                    pauseCounter = 2; 
                }
            }

            historyLogs.unshift({
                issue: lastIssue || "----", actual: `${lastNum} (${actualSize})`,
                pred: lastPrediction, status: status
            });

            document.getElementById('historyBody').innerHTML = historyLogs.map(item => {
                let badgeClass = 'badge-skip';
                if (item.status === 'WIN') badgeClass = 'badge-win';
                if (item.status === 'LOSS') badgeClass = 'badge-loss';

                return `
                <tr>
                    <td style="color:var(--text-sub)">${item.issue.slice(-4)}</td>
                    <td><b>${item.actual}</b></td>
                    <td style="font-weight:bold">${item.pred}</td>
                    <td><span class="${badgeClass}">${item.status}</span></td>
                </tr>
                `;
            }).join('');

            document.getElementById('winRateText').innerText = `WIN: ${totalWins}/${totalWins + totalLosses} (SKIPPED: ${totalSkipped})`;

            if (typeof window.syncUserActivityToCloud === 'function') {
                window.syncUserActivityToCloud(historyLogs, totalWins, totalLosses, totalSkipped);
            }
        }

        const evalResult = computeTrendRiderSignal(list);

        const predElem = document.getElementById('predTrend');
        predElem.innerText = evalResult.decision;

        const phaseElem = document.getElementById('phaseMode');
        phaseElem.innerText = evalResult.phase;

        document.getElementById('riderMode').innerText = evalResult.mode;
        document.getElementById('riderStatus').innerText = evalResult.status;

        const signalBoxElem = document.getElementById('signalBox');

        if (evalResult.decision.includes("SKIP")) {
            predElem.classList.add('skip-mode');
            signalBoxElem.classList.add('skip-mode');
        } else {
            predElem.classList.remove('skip-mode');
            signalBoxElem.classList.remove('skip-mode');
        }

        document.getElementById('logicBox').innerText = evalResult.reason;

        lastPrediction = evalResult.decision;
    }

    startTimerEngine();
    runLiveEngine();
</script>

</body>
</html>
